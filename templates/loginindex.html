<!doctype html>
<html lang="en">
  <head>
   <title>Login 10</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

   <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

   <link rel="stylesheet" href="/static/login/log/css/style.css">

   <style>
     .login-alert {
       display: flex;
       align-items: center;
       gap: 10px;
       background: rgba(217, 48, 37, 0.14);
       border: 1px solid rgba(217, 48, 37, 0.4);
       color: #ffe3e1;
       font-size: 0.88rem;
       font-weight: 500;
       padding: 12px 16px;
       border-radius: 8px;
       margin-bottom: 20px;
       text-align: left;
       animation: loginAlertIn .25s ease;
       transition: opacity .4s ease, transform .4s ease;
     }
     .login-alert.fade-out {
       opacity: 0;
       transform: translateY(-4px);
     }
     .login-alert-icon {
       color: #ff6b6b;
       font-size: 1rem;
       flex-shrink: 0;
     }
     @keyframes loginAlertIn {
       from { opacity: 0; transform: translateY(-4px); }
       to { opacity: 1; transform: translateY(0); }
     }
   </style>

   </head>
   <body class="img js-fullheight" style="background-image: url(/static/login/log/images/bg.png);">
   <section class="ftco-section">
      <div class="container">
         <div class="row justify-content-center">
            <div class="col-md-6 text-center mb-5">
               <h2 class="heading-section">Vaxicare</h2>
            </div>
         </div>
         <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
               <div class="login-wrap p-0">
             <h3 class="mb-4 text-center">Have an account?</h3>

             {% if messages %}
             {% for message in messages %}
             <div class="login-alert" role="alert">
               <span class="fa fa-exclamation-circle login-alert-icon"></span>
               <span>{{ message }}</span>
             </div>
             {% endfor %}
             {% endif %}

             <form action="/myapp/login_post/" method="post" class="signin-form">
                    {% csrf_token %}
                <div class="form-group">
                   <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
               <div class="form-group">
                 <input id="password-field" name="password" type="password" class="form-control" placeholder="Password" required>
                 <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
               </div>
               <div class="form-group">
                  <button type="submit" class="form-control btn btn-info submit px-3">Sign In</button>
               </div>
               <div class="form-group d-md-flex">
                  <div class="w-50">
{#                   <label class="checkbox-wrap checkbox-primary">Remember Me#}
{#                           <input type="checkbox" checked>#}
{#                           <span class="checkmark"></span>#}
{#                         </label>#}
                        </div>
                        <div class="w-50 text-md-right">
                           <a href="/myapp/and_forget_password/" style="color: #fff">Forgot Password</a>
                        </div>
               </div>
             </form>
             <p class="w-100 text-center">&mdash; Or Sign In With &mdash;</p>
             <div class="social d-flex text-center">
              <a href="/myapp/user_sigup_get/" class="px-2 py-2 mr-md-1 rounded"><span class="ion-logo-facebook mr-2"></span> User </a>
              <a href="/myapp/hospital_signup_get/" class="px-2 py-2 ml-md-1 rounded"><span class="ion-logo-twitter mr-2"></span> Hospital </a>
             </div>
            </div>
            </div>
         </div>
      </div>
   </section>

   <script src="/static/login/log/js/jquery.min.js"></script>
  <script src="/static/login/log/js/popper.js"></script>
  <script src="/static/login/log/js/bootstrap.min.js"></script>
  <script src="/static/login/log/js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var alerts = document.querySelectorAll('.login-alert');
      alerts.forEach(function (alertEl) {
        setTimeout(function () {
          alertEl.classList.add('fade-out');
          setTimeout(function () {
            alertEl.remove();
          }, 400);
        }, 3000);
      });
    });
  </script>

   </body>
</html>
